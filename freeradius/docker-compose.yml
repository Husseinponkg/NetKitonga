# FreeRADIUS setup with Net Kitonga backend

version: '3.8'

services:
  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: freeradius
    restart: unless-stopped
    ports:
      - "1812/udp:1812/udp"  # Authentication
      - "1813/udp:1813/udp"  # Accounting
    volumes:
      - ./freeradius/clients.conf:/etc/freeradius/3.0/clients.conf:ro
      - ./freeradius/users:/etc/freeradius/3.0/users:ro
      - ./freeradius/default:/etc/freeradius/3.0/sites-available/default:ro
    environment:
      - TZ=UTC
    command: ["freeradius", "-X"]  # Remove -X in production for foreground
